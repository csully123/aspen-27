  button.btn.ghost { background: none; color: var(--accent); border: 1px solid var(--accent); }
  button.link { background: none; border: 0; color: var(--accent); font: inherit; padding: 0; cursor: pointer; text-decoration: underline; }
  .savebar { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--pine); }
  #gate .box { background: var(--card); border-radius: 14px; padding: 26px; width: 100%; max-width: 360px; }
  #gate .err { color: #c0392b; min-height: 1.4em; font-size: .9rem; margin-top: 8px; }
  .hide { display: none !important; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  #toast.on { opacity: 1; }

</div>

/* ======================================================================
   3. APP CODE: no need to edit below this line.
   ====================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v; else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
};
const money = (n) => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = (n) => "$" + Math.round(n).toLocaleString("en-US");
const key = (name) => name.toLowerCase().replace(/[^a-z0-9]/g, "");
const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200); };
const ls = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const LIVE = !CONFIG.firebase.apiKey.startsWith("PASTE");
const C = (n) => CONFIG.prefix + n;

/* ---------- data store: Firebase when configured, this browser only otherwise ---------- */
let store;
async function makeFirebaseStore() {
  const V = "10.12.2", base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{ initializeApp }, A, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
  const app = initializeApp(CONFIG.firebase), auth = A.getAuth(app), db = F.getFirestore(app);
  await A.setPersistence(auth, A.browserLocalPersistence);
  return {
    onAuth: (cb) => A.onAuthStateChanged(auth, (u) => cb(u ? { email: u.email, organizer: u.email !== CONFIG.sharedEmail } : null)),
    signIn: (pw) => A.signInWithEmailAndPassword(auth, CONFIG.sharedEmail, pw),
    signInOrganizer: (email, pw) => A.signInWithEmailAndPassword(auth, email, pw),
    signOut: () => A.signOut(auth),
    saveResponse: (name, data) => F.setDoc(F.doc(db, C("responses"), key(name)), { ...data, name, updatedAt: F.serverTimestamp() }),
    saveRental: (name, data) => F.setDoc(F.doc(db, C("rentals"), key(name)), { ...data, name, updatedAt: F.serverTimestamp() }),
    deleteRental: (name) => F.setDoc(F.doc(db, C("rentals"), key(name)), { name, cancelled: true, updatedAt: F.serverTimestamp() }),
    watchResponses: (cb) => F.onSnapshot(F.collection(db, C("responses")), (s) => cb(s.docs.map((d) => d.data())), () => cb([])),
    watchSuggestions: (cb) => F.onSnapshot(F.query(F.collection(db, C("suggestions")), F.orderBy("createdAt", "desc")), (s) => cb(s.docs.map((d) => ({ ...d.data(), at: d.data().createdAt?.toDate?.() }))), () => cb([])),
    addSuggestion: (name, text) => F.addDoc(F.collection(db, C("suggestions")), { name, text, createdAt: F.serverTimestamp() }),
    listRentals: async () => (await F.getDocs(F.collection(db, C("rentals")))).docs.map((d) => d.data())
  };
}
function makeLocalStore() {
  const subs = { responses: [], suggestions: [] };
  const emit = (k) => subs[k].forEach((cb) => cb(k === "responses" ? Object.values(ls.get("demo_responses", {})) : ls.get("demo_suggestions", [])));
  let authCb = () => {};
  return {
    onAuth: (cb) => { authCb = cb; cb(ls.get("demo_user", null)); },
    signIn: async () => { const u = { email: "demo", organizer: false }; ls.set("demo_user", u); authCb(u); },
    signInOrganizer: async () => { const u = { email: "organizer", organizer: true }; ls.set("demo_user", u); authCb(u); },
    signOut: async () => { ls.set("demo_user", null); authCb(null); },
    saveResponse: async (name, data) => { const all = ls.get("demo_responses", {}); all[key(name)] = { ...data, name }; ls.set("demo_responses", all); emit("responses"); },
    saveRental: async (name, data) => { const all = ls.get("demo_rentals", {}); all[key(name)] = { ...data, name }; ls.set("demo_rentals", all); },
    deleteRental: async (name) => { const all = ls.get("demo_rentals", {}); all[key(name)] = { name, cancelled: true }; ls.set("demo_rentals", all); },
    watchResponses: (cb) => { subs.responses.push(cb); emit("responses"); },
    watchSuggestions: (cb) => { subs.suggestions.push(cb); emit("suggestions"); },
    addSuggestion: async (name, text) => { const all = ls.get("demo_suggestions", []); all.unshift({ name, text, at: new Date().toISOString() }); ls.set("demo_suggestions", all); emit("suggestions"); },
    listRentals: async () => Object.values(ls.get("demo_rentals", {}))
  };
}

const SKI_DAYS = ["Thu Jan 21 (afternoon)", "Fri Jan 22", "Sat Jan 23", "Sun Jan 24 (morning)"];

function radio(name, opts, val) {

}
function field(label, input) { return h("div", { class: "field" }, h("span", {}, label), input); }

function renderMe() {
  const root = $("#tab-me");
  if (!me) { root.replaceChildren(h("div", { class: "card" }, h("h2", {}, "Who are you?"), h("p", { class: "muted" }, "Pick your name at the top of the page to fill in your answers."))); return; }

  const sel = (name, opts, val) => h("select", { name }, h("option", { value: "" }, "Choose"), opts.map((o) => h("option", { value: o, selected: val === o }, o)));

  const rentalBox = h("div", { class: "card", id: "rentalBox" },
    h("h3", {}, "Rental details"),
    h("p", { class: "small muted" }, "This goes on the ski shop's form so your gear is waiting at Timbers. Only Chris can see these answers."),
    h("div", { class: "grid2" },
      field("What are you renting?", sel("r_package", RENTAL_FIELDS.packages, rent.package)),
      field("Ability", sel("r_ability", RENTAL_FIELDS.ability, rent.ability)),
      field("Height (for example 5'10\")", inp("r_height", "text", rent.height)),
      field("Weight (lb)", inp("r_weight", "number", rent.weight, { inputmode: "numeric", min: 50, max: 400 })),

    h("label", { class: "q" }, "Helmet?", h("span", { class: "hint" }, "About $14 a day.")), radio("r_helmet", ["Yes", "No"], rent.helmet),
    h("label", { class: "q" }, "Damage insurance?", h("span", { class: "hint" }, "$3 a day. Doesn't cover loss or theft.")), radio("r_insurance", ["Yes", "No"], rent.insurance));

  const form = h("form", { id: "meForm" },
    h("div", { class: "card" },

      h("p", { class: "muted small" }, "You can come back and change these any time."),
      ["splurge", "cloud9", "sushi", "budgetOk"].map((k) => [h("label", { class: "q" }, Q[k].q, Q[k].hint && h("span", { class: "hint" }, Q[k].hint)), radio(k, Q[k].opts, r[k])])),
    h("div", { class: "card" },
      h("h2", {}, "Skiing"),
      h("label", { class: "q" }, Q.pass.q, h("span", { class: "hint" }, Q.pass.hint)), radio("pass", Q.pass.opts, r.pass),
      h("label", { class: "q" }, "Which days are you planning to ski?", h("span", { class: "hint" }, "Pick all that apply, or none if you're not skiing.")),
      h("div", { class: "opts" }, SKI_DAYS.map((o) => h("label", {}, h("input", { type: "checkbox", name: "skiDays", value: o, checked: (r.skiDays || []).includes(o) }), o))),
      h("label", { class: "q" }, Q.renting.q), radio("renting", Q.renting.opts, r.renting)),
    rentalBox,
    h("div", { class: "card" },
      h("h2", {}, "Flights and airport pickup"),
      h("p", { class: "small muted" }, "Add what you know now and update it once you book."),
      h("h3", { style: "margin-top:8px" }, "Arriving"),
      h("div", { class: "grid2" },
        field("Airport", sel("a_airport", AIRPORTS, a.airport)), field("Airline and flight number", inp("a_flight", "text", a.flight)),
        field("Date", inp("a_date", "date", a.date || "2027-01-21")), field("Landing time (Mountain)", inp("a_time", "time", a.time))),
      h("h3", { style: "margin-top:16px" }, "Leaving"),
      h("div", { class: "grid2" },
        field("Airport", sel("d_airport", AIRPORTS, d.airport)), field("Airline and flight number", inp("d_flight", "text", d.flight)),
        field("Date", inp("d_date", "date", d.date || "2027-01-24")), field("Takeoff time (Mountain)", inp("d_time", "time", d.time))),
      h("label", { class: "q" }, Q.pickup.q), radio("pickup", Q.pickup.opts, r.pickup)),
    h("div", { class: "card" },
      h("h2", {}, "Anything else"),
      h("label", { class: "q" }, "Food allergies or things you don't eat?"), h("input", { type: "text", name: "diet", value: r.diet ?? "", placeholder: "None" }),
      h("label", { class: "q" }, "Anything else Chris should know?"), h("textarea", { name: "notes" }, r.notes ?? "")),

  form.addEventListener("submit", async (e) => {

        ls.set("aspen_rental_" + key(me), rental);
        await store.saveRental(me, rental);
      } else if (r.renting === "Yes") { await store.deleteRental(me); }
      toast("Saved. Thank you, " + me + "!");
    } catch (err) { console.error(err); toast("Couldn't save. Check your connection and try again."); }
    btn.disabled = false;

/* ---------- group tab ---------- */
function renderGroup() {
  const root = $("#tab-group");
  const by = Object.fromEntries(responses.map((r) => [key(r.name || ""), r]));
  const tally = (k) => { const m = {}; for (const r of responses) if (r[k]) (m[r[k]] ||= []).push(r.name); return m; };
  const tallyBlock = (title, k) => { const m = tally(k); return h("div", { class: "tally" }, h("b", {}, title),
    Object.keys(m).length ? Object.entries(m).map(([o, names]) => h("div", { class: "small" }, `${o}: ${names.join(", ")}`)) : h("div", { class: "small muted" }, "No answers yet")); };
  const skiCount = SKI_DAYS.map((dName) => [dName, responses.filter((r) => (r.skiDays || []).includes(dName)).map((r) => r.name)]);
  const legs = (which) => responses.filter((r) => r[which] && (r[which].flight || r[which].time || r[which].airport))
    .sort((x, y) => ((x[which].date || "") + (x[which].time || "")).localeCompare((y[which].date || "") + (y[which].time || "")));
  const fmt = (leg) => [leg.date && new Date(leg.date + "T12:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }), leg.time && new Date("2027-01-01T" + leg.time).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })].filter(Boolean).join(", ") || "Time TBD";
  const legTable = (which) => { const rows = legs(which); return rows.length ? h("div", { class: "scroll" }, h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Who"), h("th", {}, "When"), h("th", {}, "Airport"), h("th", {}, "Flight"), which === "arrive" && h("th", {}, "Ride?"))),
    h("tbody", {}, rows.map((r) => h("tr", {}, h("td", {}, r.name), h("td", {}, fmt(r[which])), h("td", {}, r[which].airport || ""), h("td", {}, r[which].flight || ""), which === "arrive" && h("td", {}, r.pickup || "")))))) : h("p", { class: "small muted" }, "No flights entered yet."); };

  const kids = [
    h("div", { class: "card" }, h("h2", {}, "Who's answered"),
      h("div", { class: "chips" }, PEOPLE.map((p) => h("span", { class: "chip" + (by[key(p)] ? " done" : "") }, p)))),
    h("div", { class: "card" }, h("h2", {}, "Where everyone stands"),
      tallyBlock("One splurge-ish dinner", "splurge"), tallyBlock("Cloud Nine on Friday", "cloud9"), tallyBlock("Sushi on Saturday", "sushi"), tallyBlock("Budget", "budgetOk"),
      tallyBlock("Lift access", "pass"), tallyBlock("Renting gear", "renting"),
      h("div", { class: "tally" }, h("b", {}, "Ski days"), skiCount.map(([dName, names]) => h("div", { class: "small" }, `${dName}: ${names.length ? names.join(", ") : "nobody yet"}`))),
      responses.some((r) => r.diet) && h("div", { class: "tally" }, h("b", {}, "Food notes"), responses.filter((r) => r.diet).map((r) => h("div", { class: "small" }, `${r.name}: ${r.diet}`)))),
    h("div", { class: "card" }, h("h2", {}, "Airport pickups"), h("p", { class: "small muted" }, "Sorted by time so we can pair up rides."), h("h3", {}, "Arrivals"), legTable("arrive"), h("h3", { style: "margin-top:14px" }, "Departures"), legTable("depart"))
  ];
  const orgCard = h("div", { class: "card" }, h("h2", {}, "Organizer"));
  if (user?.organizer) {
    const notes = responses.filter((r) => r.notes);
    const out = h("div", {}, h("p", { class: "small muted" }, "Loading rentals..."));
    orgCard.append(...[h("p", { class: "small muted" }, "Only you can see this part."),
      notes.length ? h("div", { class: "tally" }, h("b", {}, "Notes for you"), notes.map((r) => h("div", { class: "small" }, `${r.name}: ${r.notes}`))) : null,
      h("h3", { style: "margin:10px 0 6px" }, "Rental details"), out,
      h("p", { style: "margin-top:12px" }, h("button", { class: "link", onclick: () => store.signOut().then(() => location.reload()) }, "Sign out"))].filter(Boolean));
    store.listRentals().then((list) => {
      const rows = list.filter((x) => !x.cancelled);
      if (!rows.length) { out.replaceChildren(h("p", { class: "small muted" }, "Nobody has entered rental details yet.")); return; }
      const cols = [["Name", "name"], ["Weight", "weight"], ["Height", "height"], ["Age", "age"], ["Ability", "ability"], ["Package", "package"], ["Boot/shoe", "boot"], ["Stance", "stance"], ["Insurance", "insurance"], ["Helmet", "helmet"], ["Days", "days"]];
      const text = [cols.map((c) => c[0]).join("\t"), ...rows.map((x) => cols.map((c) => x[c[1]] || "").join("\t"))].join("\n");
      out.replaceChildren(h("div", { class: "scroll" }, h("table", {}, h("thead", {}, h("tr", {}, cols.map((c) => h("th", {}, c[0])))), h("tbody", {}, rows.map((x) => h("tr", {}, cols.map((c) => h("td", {}, x[c[1]] || ""))))))),
        h("p", { style: "margin-top:10px" }, h("button", { class: "btn ghost", onclick: () => navigator.clipboard.writeText(text).then(() => toast("Copied. Paste into the rental form.")) }, "Copy for the rental form")));
    }).catch(() => out.replaceChildren(h("p", { class: "small muted" }, "Couldn't load rentals. Check that the organizer email in your Firestore rules matches this login.")));
  } else {
    const f = h("form", { class: "hide" }, h("div", { class: "grid2" }, field("Email", h("input", { type: "email", name: "email", autocomplete: "username" })), field("Password", h("input", { type: "password", name: "pw", autocomplete: "current-password" }))),
      h("p", { style: "margin-top:10px" }, h("button", { class: "btn ghost" }, "Sign in as organizer")), h("div", { class: "small", id: "orgErr", style: "color:#c0392b" }));
    f.addEventListener("submit", async (e) => { e.preventDefault(); try { await store.signInOrganizer(f.email.value.trim(), f.pw.value); location.reload(); } catch { $("#orgErr").textContent = "That didn't work."; } });
    orgCard.append(h("p", { class: "small muted" }, "Rental details and private notes are only visible to Chris."), h("button", { class: "link", onclick: () => f.classList.toggle("hide") }, "Chris: sign in to see them"), f);
  }
  kids.push(orgCard);
  root.replaceChildren(...kids);

/* ---------- ideas tab ---------- */
function renderIdeas() {
  const ta = h("textarea", { placeholder: "A restaurant, a bar, an activity, a better plan for a day..." });
  const form = h("form", {}, ta, h("p", { style: "margin-top:10px" }, h("button", { class: "btn" }, "Add suggestion")));
  form.addEventListener("submit", async (e) => { e.preventDefault(); const text = ta.value.trim(); if (!text) return; if (!me) { toast("Pick your name at the top first."); return; }
    try { await store.addSuggestion(me, text); ta.value = ""; toast("Added. Thank you!"); } catch { toast("Couldn't add that. Try again."); } });
  $("#tab-ideas").replaceChildren(
    h("div", { class: "card" }, h("h2", {}, "Suggestions"), h("p", { class: "muted" }, "Got an idea for the trip? Add it here and everyone can see it."), form),
    h("div", { class: "card" }, suggestions.length ? suggestions.map((s) => h("div", { class: "sugg" }, h("div", {}, s.text),
      h("div", { class: "small muted" }, s.name + (s.at ? " · " + new Date(s.at).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "")))) : h("p", { class: "muted", style: "margin:0" }, "No suggestions yet. Be the first."))
  );

/* ---------- shell ---------- */
function showTab(name) {
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === name));
  document.querySelectorAll("section.tab").forEach((s) => s.classList.toggle("on", s.id === "tab-" + name));
  ls.set("aspen_tab", name); window.scrollTo(0, 0);
}
function startApp() {
  if (started) { renderGroup(); return; }
  started = true;
  const who = $("#who");
  who.replaceChildren(h("option", { value: "" }, "Who are you?"), ...PEOPLE.map((p) => h("option", { value: p, selected: p === me }, p)));
  who.addEventListener("change", () => { me = who.value; ls.set("aspen_me", me); renderMe(); });
  document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));
  renderBudget(); renderPlan(); renderMe(); renderGroup(); renderIdeas();
  store.watchResponses((list) => { responses = list; renderGroup(); if (!$("#meForm") || !document.activeElement?.closest?.("#meForm")) renderMe(); });
  store.watchSuggestions((list) => { suggestions = list; renderIdeas(); });
  showTab(ls.get("aspen_tab", "budget"));
}

(async function init() {
  store = LIVE ? await makeFirebaseStore() : makeLocalStore();
  if (!LIVE) {
    $("#gateDemo").textContent = "Preview mode: Firebase isn't connected yet, so any password works and answers stay on this device.";
    const b = $("#demoBanner"); b.classList.remove("hide"); b.textContent = "Preview mode. Answers are only saved in this browser until Firebase is connected.";
  }
  $("#gateForm").addEventListener("submit", async (e) => {
    e.preventDefault(); $("#gateErr").textContent = "";
    try { await store.signIn($("#gatePw").value); } catch { $("#gateErr").textContent = "That password didn't work."; }
  });
  store.onAuth((u) => {
    user = u;
    $("#gate").classList.toggle("hide", !!u); $("#app").classList.toggle("hide", !u);
    if (u) startApp();
  });
})();
