<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Aspen 2027</title>
<style>
  :root {
    --bg: #eef4fa; --card: #ffffff; --ink: #14304a; --muted: #5b748a; --line: #d3e1ee;
    --accent: #2476bd; --accent-ink: #ffffff; --soft: #e7f1fa; --good: #2b7a5a; --gold: #cfe8fb; --gold-ink: #0f4a7a;
    --sky1: #123a63; --sky2: #3f86c2; --sky3: #ffc9a3; --far: #cfe0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1522; --card: #132235; --ink: #e8f1f9; --muted: #93a9bd; --line: #24384d;
      --accent: #7cc0f2; --accent-ink: #06243d; --soft: #1a2c42; --good: #7fd1aa; --gold: #1f4b73; --gold-ink: #d6ecfd;
      --sky1: #050b16; --sky2: #12305a; --sky3: #5a4a78; --far: #26405e;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  h1, h2, h3 { font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; font-weight: 800; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
  h1 { font-size: 2rem; } h2 { font-size: 1.3rem; margin-bottom: 4px; } h3 { font-size: 1.05rem; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); } .small { font-size: .875rem; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

  header.top { position: relative; overflow: hidden; color: #fff; padding: 26px 0 96px; cursor: pointer;
    background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 58%, var(--sky3) 100%); }
  header.top .wrap { position: relative; z-index: 3; }
  header.top h1 { text-shadow: 0 2px 10px #0006; }
  header.top .sub { color: #e6f1fb; font-size: .92rem; margin-top: 4px; text-shadow: 0 1px 6px #0006; }
  header.top .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  header.top select { background: #ffffff26; color: #fff; border: 1px solid #ffffff66; backdrop-filter: blur(4px); cursor: pointer; }
  header.top select option { color: #111; }
  #snow { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .peaks { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 110px; z-index: 2; display: block; pointer-events: none; }
  .peaks .far { fill: var(--far); } .peaks .near { fill: var(--bg); }
  .skier { position: absolute; left: 0; bottom: 58px; font-size: 32px; z-index: 2; pointer-events: none; }
  .herohint { position: absolute; right: 14px; bottom: 10px; z-index: 3; background: none; border: 0; color: var(--muted); font: inherit; font-size: .8rem; cursor: pointer; }
  .fx { position: fixed; pointer-events: none; z-index: 50; font-size: 22px; }

  nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  nav.tabs button { flex: 1 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted);
    font: inherit; font-weight: 700; padding: 12px 10px; cursor: pointer; white-space: nowrap; }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  main { padding: 18px 0 80px; }
  section.tab { display: none; } section.tab.on { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 0 0 14px; box-shadow: 0 2px 10px #14304a0d; }
  .banner { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; font-size: .9rem; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .switches { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 4px; }
  @media (max-width: 560px) { .choices { grid-template-columns: 1fr; } }
  .choice { text-align: left; font: inherit; color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; display: block; }
  .choice span { display: block; }
  .choice .ttl { font-weight: 800; } .choice .price { font-weight: 700; color: var(--accent); margin: 2px 0 4px; }
  .choice .info { font-size: .85rem; color: var(--muted); }
  .choice .price .advnote { display: inline; font-weight: 400; font-size: .85rem; color: var(--muted); }
  .choice.on { border-color: var(--accent); background: var(--soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .daycard summary { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; cursor: pointer; list-style: none;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; font-weight: 800; font-size: 1.3rem; line-height: 1.15; }
  .daycard summary::-webkit-details-marker { display: none; }
  .daycard summary .dname::before { content: "▾"; display: inline-block; width: 1.1em; color: var(--muted); font-size: .9em; }
  .daycard:not([open]) summary .dname::before { content: "▸"; }
  .daycard[open] summary { margin-bottom: 4px; }
  .daycard summary .tot { font-variant-numeric: tabular-nums; color: var(--accent); }
  .daycard tr.off td { color: var(--muted); text-decoration: line-through; opacity: .6; }
  .daycard tr:last-child td { border-bottom: 0; }
  .skitag { font-size: .7rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--sky2); margin-left: 6px; }
  @media (prefers-color-scheme: dark) { .skitag { color: #8cc4f2; } }
  .grand { background: var(--card); color: var(--ink); border: 3px solid var(--accent); cursor: pointer; text-align: center; padding: 20px 16px; }
  .grand .lbl { font-weight: 800; font-size: 1.05rem; }
  .grand .big { font-size: 3.2rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--accent); margin: 4px 0; }

  .cmp { display: grid; grid-template-columns: 1fr; gap: 10px; border-top: 1px solid var(--line); padding: 14px 0; }
  .cmp:first-of-type { border-top: 0; }
  @media (min-width: 680px) { .cmp { grid-template-columns: 230px 1fr; gap: 18px; } }
  .cmp .label { grid-column: 1 / -1; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; }
  .colhead { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
  .lastbox { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; height: fit-content; }
  .lastbox .name { font-weight: 700; } .lastbox .cost { color: var(--accent); font-weight: 700; }
  .pick { background: var(--soft); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .pick:last-child { margin-bottom: 0; }
  .pick .name { font-weight: 800; } .pick .cost { font-weight: 700; color: var(--accent); margin-left: 6px; white-space: nowrap; }
  .pick .tag { display: inline-block; font-size: .68rem; font-weight: 800; color: var(--gold-ink); background: var(--gold); border-radius: 999px; padding: 1px 8px; text-transform: uppercase; letter-spacing: .04em; margin-left: 6px; vertical-align: 2px; }
  .pick .res { font-size: .875rem; margin-top: 4px; color: var(--muted); font-weight: 400; font-style: italic; }

  label.q { display: block; font-weight: 700; margin: 16px 0 6px; }
  .hint { font-weight: 400; color: var(--muted); font-size: .875rem; display: block; margin-top: 2px; position: static; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opts label, .switches label { border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; background: var(--card); user-select: none; font-weight: 600; }
  .opts input, .switches input { position: absolute; opacity: 0; pointer-events: none; }
  .opts label:has(input:checked), .switches label:has(input:checked) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .opts label:has(input:focus-visible), .switches label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=text], input[type=password], input[type=email], input[type=number], input[type=date], input[type=time], select, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 84px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid2 > div > span, .field > span { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 3px; }
  @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
  button.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; font: inherit; font-weight: 800; padding: 12px 20px; cursor: pointer; }
  button.btn:active { transform: scale(.97); }
  button.btn.ghost { background: none; color: var(--accent); border: 2px solid var(--accent); }
  button.link { background: none; border: 0; color: var(--accent); font: inherit; padding: 0; cursor: pointer; text-decoration: underline; }
  .savebar { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border-radius: 999px; padding: 4px 10px; font-size: .85rem; border: 1px solid var(--line); }
  .chip.done { background: var(--good); color: var(--card); border-color: var(--good); }
  .tally { margin: 10px 0; } .tally b { display: block; }
  .scroll { overflow-x: auto; }
  #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 60%, var(--sky3) 100%); }
  #gate .box { background: var(--card); border-radius: 18px; padding: 26px; width: 100%; max-width: 360px; box-shadow: 0 10px 40px #0005; }
  #gate .err { color: #c0392b; min-height: 1.4em; font-size: .9rem; margin-top: 8px; }
  .hide { display: none !important; }
  .sugg { border-top: 1px solid var(--line); padding: 10px 0; } .sugg:first-child { border-top: 0; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
  #toast.on { opacity: 1; }
  /* ---- make everything clickable look clickable ---- */
  .opts label, .switches label { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--accent); color: var(--accent); background: var(--card);
    font-weight: 700; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 35%, transparent); transition: transform .06s, box-shadow .06s, background .1s; }
  .opts label::before, .switches label::before { content: ""; flex: none; width: 18px; height: 18px; border: 2px solid currentColor; border-radius: 50%; display: grid; place-items: center; font-size: 12px; line-height: 1; font-weight: 900; }
  .opts label:has(input[type=checkbox])::before, .switches label::before { border-radius: 5px; }
  .opts label:has(input:checked)::before, .switches label:has(input:checked)::before { content: "✓"; background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }
  .opts label:hover, .switches label:hover { background: var(--soft); }
  .opts label:has(input:checked):hover, .switches label:has(input:checked):hover { background: var(--accent); }
  .opts label:active, .switches label:active, .choice:active, button.btn:active { transform: translateY(2px); box-shadow: none; }
  .choice { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 30%, transparent); transition: transform .06s, box-shadow .06s, background .1s; }
  .choice:hover { background: var(--soft); }
  .choice .ttl { display: flex; align-items: flex-start; gap: 8px; }
  .choice .ttl::before { content: ""; flex: none; width: 18px; height: 18px; margin-top: 2px; border: 2px solid var(--accent); border-radius: 50%; display: grid; place-items: center; font-size: 12px; line-height: 1; font-weight: 900; color: var(--accent-ink); }
  .choice.on .ttl::before { content: "✓"; background: var(--accent); }
  .choice .tap { font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); margin-top: 8px; }
  button.btn { box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 45%, #000); transition: transform .06s, box-shadow .06s; }
  button.btn.ghost { box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 35%, transparent); }
  .daycard summary { border-radius: 10px; margin: -6px -8px; padding: 6px 8px; }
  .daycard[open] summary { margin-bottom: 0; }
  .daycard summary:hover { background: var(--soft); }
  .daycard summary .dname::before { width: 1.5em; height: 1.5em; margin-right: 8px; border: 2px solid var(--accent); border-radius: 8px; color: var(--accent);
    display: inline-grid; place-items: center; font-size: .8em; vertical-align: 2px; }
  .daycard summary .dname::after { content: "tap to close"; font: 600 .72rem/1 -apple-system, "Segoe UI", sans-serif; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
  .daycard:not([open]) summary .dname::after { content: "tap to open"; }
  nav.tabs button { border-radius: 10px 10px 0 0; } nav.tabs button:hover { background: var(--soft); color: var(--ink); }
  header.top select { background: #fff; color: #14304a; border: 2px solid #fff; font-weight: 700; box-shadow: 0 3px 0 #0003; }
  .herohint { text-decoration: underline; }
  button.link { font-weight: 700; }
  .switches label.goldbtn { border-color: #d4a017; color: var(--ink); box-shadow: 0 3px 0 #d4a01766; }
  .switches label.goldbtn::before { border-color: #d4a017; }
  .switches label.goldbtn:has(input:checked), .switches label.goldbtn:has(input:checked):hover { background: #d4a017; border-color: #d4a017; color: #2a1e00; }
  .switches label.goldbtn:has(input:checked)::before { background: #2a1e00; color: #f3c748; border-color: #2a1e00; }
  .switches label.goldbtn:has(input:focus-visible) { outline-color: #d4a017; }
  /* ---- plan page: divider, pickable options, ideas ---- */
  .cmp .thisyear { grid-column: 1 / -1; }
  button.pick { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
    border: 2px solid color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 30%, transparent); transition: transform .06s, box-shadow .06s; }
  button.pick:hover { border-color: var(--accent); } button.pick:active { transform: translateY(2px); box-shadow: none; }
  button.pick.mine { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), 0 3px 0 color-mix(in srgb, var(--accent) 30%, transparent); }
  .pick .blk { display: block; }
  .pick .head { display: flex; align-items: flex-start; gap: 8px; }
  .pick .head::before { content: ""; flex: none; width: 18px; height: 18px; margin-top: 2px; border: 2px solid var(--accent); border-radius: 50%; display: grid; place-items: center; font-size: 12px; line-height: 1; font-weight: 900; color: var(--accent-ink); }
  .pick.mine .head::before { content: "✓"; background: var(--accent); }
  .pickchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pickchip { background: var(--accent); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 800; }
  .ideabox { margin-top: 10px; }
  .idea { font-size: .9rem; padding: 6px 0; border-top: 1px dashed var(--line); }
  .ideaform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; } .ideaform input { flex: 1 1 220px; }
  button.btn.sm { padding: 8px 14px; font-size: .9rem; }
  .ideabox button.btn.ghost { background: #ffffff; color: #1b5f9e; border: 2px solid #2476bd; box-shadow: 0 3px 0 #2476bd55; }
  .ideabox button.btn.ghost:hover { background: #eaf3fb; }
  .ideabtns { display: flex; flex-wrap: wrap; gap: 8px; }
  ul.c9list { margin: 0 0 12px; padding-left: 22px; } ul.c9list li { margin: 6px 0; }
  .ideabox button.btn.ghost.on { background: #2476bd; color: #ffffff; border-color: #2476bd; }
  .ideabox button.btn.ghost.on:hover { background: #1f68a8; }
  .pick.taken { opacity: .6; border: 1px dashed var(--line); }
  .lede { font-size: 1.06rem; line-height: 1.6; margin: 8px 0 0; }
  a.abtn { display: inline-block; background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-weight: 800; padding: 11px 18px; text-decoration: none;
    box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 35%, transparent); }
  a.abtn:hover { filter: brightness(1.06); }
  a.tlink { color: var(--accent); font-weight: 700; }
  .flightbox { background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0 16px; }
  .leg { border-top: 1px solid var(--line); padding: 10px 0; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .leg:first-of-type { border-top: 0; }
  .leg .day { font-weight: 800; } .leg .price { font-weight: 800; color: var(--accent); white-space: nowrap; }
  .who2 { display: inline-block; font-size: .7rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--gold-ink); background: var(--gold); border-radius: 999px; padding: 2px 9px; }
  table.flights tr.theirs td { background: var(--soft); }
  table.flights td { padding: 9px 6px; }
  table.flights a.tlink { white-space: nowrap; }
  table.flights tr.hasnote td { border-bottom: 0; padding-bottom: 2px; }
  table.flights tr.note td { padding-top: 0; padding-bottom: 10px; }
  .flag { display: inline-block; font-size: .7rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; border-radius: 999px; padding: 2px 9px; margin-right: 6px; }
  .flag.tight { color: #7a5600; background: #fbeec6; } .flag.late { color: #9b2226; background: #fbdcdc; }
  @media (prefers-color-scheme: dark) { .flag.tight { color: #f1cf73; background: #3d3211; } .flag.late { color: #f5a3a3; background: #45191b; } }
  .trip h3 { margin: 16px 0 6px; }
  .trip ul, .trip ol { margin: 6px 0 0; padding-left: 22px; } .trip li { margin: 7px 0; }
  .trip .lede + .lede { margin-top: 12px; } .trip ol + .lede { margin-top: 16px; }
  h2.welcome { font-size: clamp(1.8rem, 7.2vw, 2.7rem); line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; color: #6d3fd1; margin-bottom: 10px; }
  @media (prefers-color-scheme: dark) { h2.welcome { color: #b9a2ff; } }
  .chrisnote { margin: 2px 0 14px; }
  figure.logo { margin: 12px 0 0; }
  figure.logo img { display: block; width: 100%; max-width: 280px; height: auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
  figure.logo figcaption { margin-top: 6px; }
  .addr { font-weight: 700; font-size: 1.05rem; }
  .itin { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding: 12px 0; }
  .itin .d { font-weight: 800; }
  .tbd { display: inline-block; font-size: .74rem; font-weight: 800; letter-spacing: .08em; color: var(--muted); border: 1px dashed var(--muted); border-radius: 999px; padding: 3px 12px; }
</style>
</head>
<body>

<div id="gate">
  <form class="box" id="gateForm">
    <h1>Aspen 2027</h1>
    <p class="muted" style="margin-top:6px">Enter the trip password.</p>
    <input type="password" id="gatePw" autocomplete="current-password" placeholder="Password" aria-label="Trip password">
    <div class="err" id="gateErr"></div>
    <button class="btn" style="width:100%">Enter</button>
    <p class="small muted" id="gateDemo" style="margin:12px 0 0"></p>
  </form>
</div>

<div id="app" class="hide">
  <header class="top" id="hero">
    <canvas id="snow" aria-hidden="true"></canvas>
    <div class="wrap"><div class="row">
      <div><h1>Aspen 2027 ⛷️</h1><div class="sub">Thu Jan 21 to Sun Jan 24 · Timbers Club, Snowmass · 7 of us</div></div>
      <div><select id="who" aria-label="Who are you?"></select></div>
    </div></div>
    <svg class="peaks" viewBox="0 0 1200 160" preserveAspectRatio="none" aria-hidden="true">
      <polygon class="far" points="0,160 0,92 140,42 260,98 400,22 540,102 660,52 800,108 940,32 1080,92 1200,58 1200,160"/>
      <polygon class="near" points="0,160 0,122 180,74 330,128 520,64 700,132 860,84 1020,138 1200,98 1200,160"/>
    </svg>
    <button class="herohint" type="button">Tap the mountain</button>
  </header>
  <nav class="tabs"><div class="wrap" role="tablist">
    <button data-tab="trip" aria-selected="true">The Trip</button>
    <button data-tab="budget">Budget</button>
    <button data-tab="plan">Plan</button>
    <button data-tab="me">My answers</button>
  </div></nav>
  <main><div class="wrap">
    <div class="banner hide" id="demoBanner"></div>
    <section class="tab on" id="tab-trip"></section>
    <section class="tab" id="tab-budget"></section>
    <section class="tab" id="tab-plan"></section>

  for (let i = 0; i < n; i++) {
    const s = h("span", { class: "fx" }, emojis[i % emojis.length]); document.body.append(s);
    const ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 150;
    const dx = Math.cos(ang) * dist, dy = up ? -Math.abs(Math.sin(ang)) * dist * 1.6 - 30 : Math.sin(ang) * dist + 70;
