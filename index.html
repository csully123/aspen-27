<style>

  .fx { position: fixed; pointer-events: none; z-index: 50; font-size: 22px; }

  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

  td, th { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .switches { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .daycard h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .daycard h2 .tot { font-variant-numeric: tabular-nums; color: var(--accent); }
  .daycard tr.off td { color: var(--muted); text-decoration: line-through; opacity: .6; }

  .cmp:first-of-type { border-top: 0; }

  button.link { background: none; border: 0; color: var(--accent); font: inherit; padding: 0; cursor: pointer; text-decoration: underline; }
  .savebar { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg);

  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v; else el.setAttribute(k, v === true ? "" : v);

    watchSuggestions: (cb) => F.onSnapshot(F.query(F.collection(db, C("suggestions")), F.orderBy("createdAt", "desc")), (s) => cb(s.docs.map((d) => ({ ...d.data(), at: d.data().createdAt?.toDate?.() }))), () => cb([])),
    addSuggestion: (name, text) => F.addDoc(F.collection(db, C("suggestions")), { name, text, createdAt: F.serverTimestamp() }),

function makeLocalStore() {

  let authCb = () => {};

    onAuth: (cb) => { authCb = cb; cb(ls.get("demo_user", null)); },
    signIn: async () => { const u = { email: "demo", organizer: false }; ls.set("demo_user", u); authCb(u); },
    signInOrganizer: async () => { const u = { email: "organizer", organizer: true }; ls.set("demo_user", u); authCb(u); },
    signOut: async () => { ls.set("demo_user", null); authCb(null); },

    saveRental: async (name, data) => { const all = ls.get("demo_rentals", {}); all[key(name)] = { ...data, name }; ls.set("demo_rentals", all); },
    deleteRental: async (name) => { const all = ls.get("demo_rentals", {}); all[key(name)] = { name, cancelled: true }; ls.set("demo_rentals", all); },
    watchResponses: (cb) => { subs.responses.push(cb); emit("responses"); },

const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(x, y, emojis, n = 18, up = false) {
  if (calm) return;
  for (let i = 0; i < n; i++) {
    const s = h("span", { class: "fx" }, emojis[i % emojis.length]); document.body.append(s);
    const ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 150;
    const dx = Math.cos(ang) * dist, dy = up ? -Math.abs(Math.sin(ang)) * dist * 1.6 - 30 : Math.sin(ang) * dist + 70;
    s.style.left = x + "px"; s.style.top = y + "px";
    s.animate([{ transform: "translate(-50%,-50%) scale(.4)", opacity: 1 }, { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.25) rotate(${Math.random() * 360}deg)`, opacity: 0 }],

  }
}

}

  if (calm) return;
  const c = $("#snow"), hero = $("#hero"), ctx = c.getContext("2d"); let flakes = [], W = 0, H = 0;
  const size = () => { W = c.width = hero.clientWidth; H = c.height = hero.clientHeight; flakes = Array.from({ length: Math.round(W / 14) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 2.2, v: .3 + Math.random() * .9, d: Math.random() * 6.28 })); };

      const text = [cols.map((c) => c[0]).join("\t"), ...rows.map((x) => cols.map((c) => x[c[1]] || "").join("\t"))].join("\n");
      out.replaceChildren(h("div", { class: "scroll" }, h("table", {}, h("thead", {}, h("tr", {}, cols.map((c) => h("th", {}, c[0])))), h("tbody", {}, rows.map((x) => h("tr", {}, cols.map((c) => h("td", {}, x[c[1]] || ""))))))),
        h("p", { style: "margin-top:10px" }, h("button", { class: "btn ghost", onclick: () => navigator.clipboard.writeText(text).then(() => toast("Copied. Paste into the rental form.")) }, "Copy for the rental form")));
    }).catch(() => out.replaceChildren(h("p", { class: "small muted" }, "Couldn't load rentals. Check that the organizer email in your Firestore rules matches this login.")));
  } else {
    const f = h("form", { class: "hide" }, h("div", { class: "grid2" }, field("Email", h("input", { type: "email", name: "email", autocomplete: "username" })), field("Password", h("input", { type: "password", name: "pw", autocomplete: "current-password" }))),
      h("p", { style: "margin-top:10px" }, h("button", { class: "btn ghost" }, "Sign in as organizer")), h("div", { class: "small", id: "orgErr", style: "color:#c0392b" }));
    f.addEventListener("submit", async (e) => { e.preventDefault(); try { await store.signInOrganizer(f.email.value.trim(), f.pw.value); location.reload(); } catch { $("#orgErr").textContent = "That didn't work."; } });
    orgCard.append(h("p", { class: "small muted" }, "Rental details and private notes are only visible to Chris."), h("button", { class: "link", onclick: () => f.classList.toggle("hide") }, "Chris: sign in to see them"), f);
  }
  kids.push(orgCard);
  root.replaceChildren(...kids);
}

/* ---------- ideas tab ---------- */
function renderIdeas() {
  const ta = h("textarea", { placeholder: "A restaurant, a bar, an activity, a better plan for a day..." });
  const form = h("form", {}, ta, h("p", { style: "margin-top:10px" }, h("button", { class: "btn" }, "Add suggestion")));
  form.addEventListener("submit", async (e) => { e.preventDefault(); const text = ta.value.trim(); if (!text) return; if (!me) { toast("Pick your name at the top first."); return; }
    try { await store.addSuggestion(me, text); ta.value = ""; toast("Added. Thank you!"); } catch { toast("Couldn't add that. Try again."); } });
  $("#tab-ideas").replaceChildren(
    h("div", { class: "card" }, h("h2", {}, "Suggestions"), h("p", { class: "muted" }, "Got an idea for the trip? Add it here and everyone can see it."), form),
    h("div", { class: "card" }, suggestions.length ? suggestions.map((s) => h("div", { class: "sugg" }, h("div", {}, s.text),
      h("div", { class: "small muted" }, s.name + (s.at ? " · " + new Date(s.at).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "")))) : h("p", { class: "muted", style: "margin:0" }, "No suggestions yet. Be the first."))
  );
}

/* ---------- shell ---------- */
function showTab(name) {
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === name));
  document.querySelectorAll("section.tab").forEach((s) => s.classList.toggle("on", s.id === "tab-" + name));
  ls.set("aspen_tab", name); window.scrollTo(0, 0);
}
function startApp() {
  if (started) { renderGroup(); return; }
  started = true;
  const who = $("#who");
  who.replaceChildren(h("option", { value: "" }, "Who are you?"), ...PEOPLE.map((p) => h("option", { value: p, selected: p === me }, p)));
  who.addEventListener("change", () => { me = who.value; ls.set("aspen_me", me); renderMe(); });
  document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));
  renderBudget(); renderPlan(); renderMe(); renderGroup(); renderIdeas();
  $("#hero").addEventListener("click", (e) => { if (!e.target.closest("select")) skiRun(); });
  startSnow();
  store.watchResponses((list) => { responses = list; renderGroup(); if (!$("#meForm") || !document.activeElement?.closest?.("#meForm")) renderMe(); });
  store.watchSuggestions((list) => { suggestions = list; renderIdeas(); });
  showTab(ls.get("aspen_tab", "budget"));
}

(async function init() {
  store = LIVE ? await makeFirebaseStore() : makeLocalStore();
  if (!LIVE) {
    $("#gateDemo").textContent = "Preview mode: Firebase isn't connected yet, so any password works and answers stay on this device.";
    const b = $("#demoBanner"); b.classList.remove("hide"); b.textContent = "Preview mode. Answers are only saved in this browser until Firebase is connected.";
  }
  $("#gateForm").addEventListener("submit", async (e) => {
    e.preventDefault(); $("#gateErr").textContent = "";
    try { await store.signIn($("#gatePw").value); } catch { $("#gateErr").textContent = "That password didn't work."; }
  });
  store.onAuth((u) => {
    user = u;
    $("#gate").classList.toggle("hide", !!u); $("#app").classList.toggle("hide", !u);
    if (u) startApp();
  });
})();
</script>
